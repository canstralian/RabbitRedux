name: Security Scanning

# Trigger on commits to main branch and pull requests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Job 1: Dependency Security Scanning
  dependency-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: 'pip'
    
    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit
    
    - name: Run Safety check
      run: |
        echo "## 🔒 Dependency Security Scan (Safety)" >> $GITHUB_STEP_SUMMARY
        # Check dependencies for known security vulnerabilities
        safety check --json > safety-report.json || true
        if [ -s safety-report.json ]; then
          echo "⚠️ Potential vulnerabilities found. See artifacts for details." >> $GITHUB_STEP_SUMMARY
          safety check || true
        else
          echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: Run pip-audit
      run: |
        echo "## 🔍 Python Package Audit (pip-audit)" >> $GITHUB_STEP_SUMMARY
        # Audit Python packages for known vulnerabilities
        pip-audit --desc --format json > pip-audit-report.json || true
        if [ -s pip-audit-report.json ]; then
          echo "⚠️ Audit completed. Check artifacts for detailed report." >> $GITHUB_STEP_SUMMARY
          pip-audit --desc || true
        else
          echo "✅ No vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
        fi
      continue-on-error: true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json
        retention-days: 90

  # Job 2: CodeQL Analysis (SAST)
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
        queries: security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:python"
    
    - name: Generate CodeQL summary
      run: |
        echo "## 🛡️ CodeQL Security Analysis" >> $GITHUB_STEP_SUMMARY
        echo "✅ Static Application Security Testing (SAST) completed" >> $GITHUB_STEP_SUMMARY
        echo "Check the Security tab for detailed findings" >> $GITHUB_STEP_SUMMARY

  # Job 3: Secret Scanning (using Gitleaks)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate secret scan summary
      if: always()
      run: |
        echo "## 🔐 Secret Scanning" >> $GITHUB_STEP_SUMMARY
        echo "✅ Repository scanned for exposed secrets" >> $GITHUB_STEP_SUMMARY

  # Job 4: Security audit summary
  security-summary:
    name: Security Audit Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, codeql-analysis, secret-scan]
    if: always()
    
    steps:
    - name: Generate overall security summary
      run: |
        echo "## 🔒 Security Audit Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Secret Scanning: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📋 Detailed reports available in artifacts and Security tab" >> $GITHUB_STEP_SUMMARY
