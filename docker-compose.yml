version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbitredux-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - MODEL_NAME=${MODEL_NAME:-canstralian/WhiteRabbitNeo}
      - WORKERS=${WORKERS:-4}
      - THREADS=${THREADS:-2}
      - TIMEOUT=${TIMEOUT:-120}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      # Optional: Mount volume for model caching to speed up restarts
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

volumes:
  model-cache:
    driver: local
